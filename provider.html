<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clinical Care</title>
<script>try{var t=localStorage.getItem('family-demo-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<style>
  :root {
    --bg: #F2F2F7; --surface: #FFFFFF; --surface-2: #F2F2F7;
    --separator: rgba(60,60,67,.18); --text: #000; --muted: #8E8E93;
    --brand: #007AFF; --brand-soft: rgba(0,122,255,.12);
    --green: #34C759; --amber: #FF9F0A; --amber-soft: rgba(255,159,10,.16);
    --red: #FF3B30; --red-soft: rgba(255,59,48,.12);
    --admin: #AF52DE; --admin-soft: rgba(175,82,222,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --tab-h: 56px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --focus: 0 0 0 3px rgba(0,122,255,.35);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #000; --surface: #1C1C1E; --surface-2: #2C2C2E;
    --separator: rgba(84,84,88,.65); --text: #F5F5F7; --muted: #8E8E93;
    --brand: #0A84FF; --brand-soft: rgba(10,132,255,.22);
    --green: #30D158; --amber: #FFD60A; --amber-soft: rgba(255,214,10,.18);
    --red: #FF453A; --red-soft: rgba(255,69,58,.2);
    --admin: #BF5AF2; --admin-soft: rgba(191,90,242,.22);
    --focus: 0 0 0 3px rgba(10,132,255,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; line-height: 1.35; letter-spacing: -.01em;
  }
  button, input, textarea { font-family: inherit; border: none; background: none; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--focus); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  .app { max-width: 430px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
  .panels { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  .panel {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    opacity: 0; visibility: hidden; transition: opacity .25s ease;
  }
  .panel.active { opacity: 1; visibility: visible; }

  .nav {
    flex-shrink: 0; padding: calc(var(--safe-t) + 8px) 16px 10px;
    background: rgba(242,242,247,.92);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  }
  html[data-theme="dark"] .nav { background: rgba(0,0,0,.88); }
  .nav-title { font-size: 2rem; font-weight: 700; letter-spacing: -.04em; margin: 4px 0 12px; }
  .seg {
    display: flex; padding: 2px; background: rgba(118,118,128,.12); border-radius: 9px;
  }
  html[data-theme="dark"] .seg { background: rgba(118,118,128,.24); }
  .seg button {
    flex: 1; min-height: 32px; border-radius: 7px; font-size: .85rem; font-weight: 600; color: var(--text);
  }
  .seg button.active {
    background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04);
  }

  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px calc(var(--tab-h) + var(--safe-b) + 20px); }

  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--surface); border-radius: 14px; padding: 12px 12px 12px 14px;
    margin-bottom: 8px; text-align: left; box-shadow: var(--shadow); min-height: 72px;
  }
  .row:active { opacity: .88; }
  .ava {
    width: 44px; height: 44px; border-radius: 50%; color: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: .9rem;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 1.05rem; font-weight: 600; letter-spacing: -.02em; }
  .row-sub { font-size: .88rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .need {
    width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0;
  }
  .auto-btn {
    flex-shrink: 0; min-height: 32px; padding: 0 11px; border-radius: 99px;
    background: var(--brand-soft); color: var(--brand); font-size: .8rem; font-weight: 600;
  }
  .auto-btn:active { opacity: .7; }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 1rem; }

  /* Thread */
  .chat { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--bg); }
  .top {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    padding: calc(var(--safe-t) + 6px) 12px 10px;
    background: rgba(255,255,255,.9);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--separator);
  }
  html[data-theme="dark"] .top { background: rgba(28,28,30,.92); }
  .back {
    width: 36px; height: 36px; border-radius: 50%; color: var(--brand);
    font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
  }
  .top-ava {
    width: 36px; height: 36px; border-radius: 50%; color: #fff; font-weight: 600; font-size: .8rem;
    display: flex; align-items: center; justify-content: center;
  }
  .top-title { font-size: 1.05rem; font-weight: 600; letter-spacing: -.02em; }
  .top-sub { font-size: .8rem; color: var(--muted); }
  .top-auto {
    margin-left: auto; min-height: 32px; padding: 0 12px; border-radius: 99px;
    background: var(--brand-soft); color: var(--brand); font-size: .82rem; font-weight: 600;
  }

  .ch-seg {
    display: flex; margin: 10px 16px 0; padding: 2px; flex-shrink: 0;
    background: rgba(118,118,128,.12); border-radius: 9px;
  }
  html[data-theme="dark"] .ch-seg { background: rgba(118,118,128,.24); }
  .ch-seg button {
    flex: 1; min-height: 32px; border-radius: 7px; font-size: .82rem; font-weight: 600; color: var(--muted);
  }
  .ch-seg button.active {
    background: var(--surface); color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }

  .feed {
    flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { display: flex; gap: 8px; }
  .msg.me { flex-direction: row-reverse; }
  .msg-ava {
    width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: .65rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .msg-col { max-width: 78%; }
  .msg.me .msg-col { text-align: right; }
  .msg-name { font-size: .75rem; color: var(--muted); margin: 0 4px 3px; }
  .bubble {
    display: inline-block; text-align: left; padding: 9px 13px; border-radius: 18px;
    border-bottom-left-radius: 5px; background: var(--surface); font-size: 1rem; line-height: 1.35;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .msg.me .bubble {
    background: var(--brand); color: #fff;
    border-bottom-left-radius: 18px; border-bottom-right-radius: 5px; box-shadow: none;
  }
  .msg-time { font-size: .7rem; color: var(--muted); margin: 3px 6px 0; }

  .composer {
    flex-shrink: 0; background: var(--surface); border-top: .5px solid var(--separator);
    padding: 8px 12px calc(10px + var(--tab-h) + var(--safe-b));
  }
  .suggests { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  .suggests::-webkit-scrollbar { display: none; }
  .suggest {
    flex-shrink: 0; min-height: 34px; padding: 7px 12px; border-radius: 99px;
    background: var(--surface-2); color: var(--brand); font-size: .84rem; font-weight: 500;
  }
  .suggest:active { opacity: .7; }
  .bar { display: flex; gap: 8px; align-items: flex-end; }
  .bar textarea {
    flex: 1; border-radius: 20px; background: var(--surface-2); padding: 9px 14px;
    font-size: 1rem; resize: none; min-height: 36px; max-height: 110px; field-sizing: content;
  }
  .bar textarea:focus { outline: none; box-shadow: var(--focus); }
  .send {
    width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff;
    font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  /* Sheets */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: .25s; z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .overlay.show { opacity: 1; visibility: visible; }
  .sheet {
    width: 100%; max-width: 430px; background: var(--surface); border-radius: 14px 14px 0 0;
    padding: 8px 20px calc(20px + var(--safe-b)); transform: translateY(100%);
    transition: transform .32s cubic-bezier(.32,.72,0,1); max-height: 88vh; overflow-y: auto;
  }
  .overlay.show .sheet { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 99px; background: rgba(60,60,67,.28); margin: 0 auto 14px; }
  .sheet h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
  .sheet .sub { font-size: .9rem; color: var(--muted); margin: 0 0 16px; line-height: 1.4; }

  .card {
    background: var(--surface-2); border-radius: 14px; padding: 14px; margin-bottom: 10px;
  }
  .card .src {
    font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .02em; margin-bottom: 6px;
  }
  .card .t { font-size: 1.05rem; font-weight: 500; letter-spacing: -.01em; }
  .card .meta { font-size: .88rem; color: var(--muted); margin-top: 6px; }
  .card-acts { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; min-height: 44px; border-radius: 12px; font-size: 1rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-soft { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .btn-quiet { background: transparent; color: var(--red); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
  .field textarea, .field input {
    width: 100%; border-radius: 12px; background: var(--surface-2); padding: 12px 14px;
    font-size: 1.05rem; min-height: 48px;
  }
  .field textarea { min-height: 90px; resize: vertical; line-height: 1.4; }
  .field textarea:focus, .field input:focus { outline: none; box-shadow: var(--focus); }
  .acts { display: flex; gap: 10px; margin-top: 8px; }
  .acts .btn { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--safe-b) + 16px); transform: translate(-50%, 16px);
    background: rgba(28,28,30,.92); color: #fff; padding: 12px 18px; border-radius: 14px;
    font-size: .95rem; font-weight: 500; opacity: 0; pointer-events: none; z-index: 80;
    transition: .3s cubic-bezier(.2,.8,.2,1); max-width: 88%;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .foot-link {
    display: block; text-align: center; margin-top: 20px; color: var(--brand);
    font-size: .95rem; font-weight: 500; text-decoration: none; min-height: 44px; line-height: 44px;
  }

  /* Mobile app footer */
  .tabbar {
    position: sticky; bottom: 0; z-index: 40;
    height: calc(var(--tab-h) + var(--safe-b)); padding-bottom: var(--safe-b);
    display: flex; align-items: stretch;
    background: rgba(255,255,255,.86); border-top: .5px solid var(--separator);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  }
  html[data-theme="dark"] .tabbar { background: rgba(28,28,30,.9); }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-height: 44px; font-size: .64rem; font-weight: 500; color: var(--muted); position: relative;
  }
  .tab svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .tab.active { color: var(--brand); }
  .tab.active svg { stroke-width: 2.1; }
  .home-indicator {
    position: absolute; left: 50%; bottom: calc(6px + env(safe-area-inset-bottom, 0px) * 0.15);
    transform: translateX(-50%); width: 120px; height: 5px; border-radius: 99px;
    background: rgba(0,0,0,.18); pointer-events: none;
  }
  html[data-theme="dark"] .home-indicator { background: rgba(255,255,255,.28); }
  @supports (padding: env(safe-area-inset-bottom)) {
    .home-indicator { bottom: max(6px, calc(var(--safe-b) * 0.35)); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="panels">
    <div class="panel active" id="panel-list">
      <div class="nav">
        <div class="nav-title">Patients</div>
        <div class="seg" role="tablist" aria-label="Filter">
          <button type="button" class="active" id="fltNeed" onclick="setFilter('need')">Most need</button>
          <button type="button" id="fltAll" onclick="setFilter('all')">All</button>
        </div>
      </div>
      <div class="list" id="patientList"></div>
    </div>

    <div class="panel" id="panel-thread">
      <div class="chat">
        <div class="top">
          <button type="button" class="back" onclick="closeThread()" aria-label="Back">‹</button>
          <div class="top-ava" id="thAva">RW</div>
          <div style="min-width:0">
            <div class="top-title" id="thTitle">Patient</div>
            <div class="top-sub" id="thSub"></div>
          </div>
          <button type="button" class="top-auto" onclick="openAutoTasks(currentId)">Auto Tasks</button>
        </div>
        <div class="ch-seg" role="tablist">
          <button type="button" class="active" id="segCg" onclick="setChannel('caregiver')">Primary Caregiver</button>
          <button type="button" id="segCare" onclick="setChannel('care')">Care team</button>
        </div>
        <div class="feed" id="feed"></div>
        <div class="composer">
          <div class="suggests" id="suggests"></div>
          <div class="bar">
            <textarea id="input" rows="1" placeholder="Message…" autocomplete="off"></textarea>
            <button type="button" class="send" id="sendBtn" aria-label="Send">↑</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar" role="navigation" aria-label="Clinical">
    <button type="button" class="tab active" id="tabPatients" onclick="goPatients()" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Patients
    </button>
    <button type="button" class="tab" id="tabReview" onclick="openFeedback()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Review
    </button>
    <div class="home-indicator" aria-hidden="true"></div>
  </nav>
</div>

<div class="overlay" id="autoSheet">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <h2 id="autoTitle">Auto Tasks</h2>
    <p class="sub" id="autoSub">From the latest assessment — approve to send to the family.</p>
    <div id="autoList"></div>
    <button type="button" class="btn btn-soft" style="width:100%;margin-top:4px" onclick="refreshAuto()">Refresh suggestions</button>
    <a class="foot-link" href="consumer.html">Open Family Care</a>
  </div>
</div>

<div class="overlay" id="taskReviewSheet">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <h2>Review task</h2>
    <p class="sub">Edit if needed, then send to the primary caregiver.</p>
    <div class="field">
      <label for="rvTitle">Task</label>
      <textarea id="rvTitle"></textarea>
    </div>
    <div class="field">
      <label for="rvDate">Due</label>
      <input id="rvDate" type="date" />
    </div>
    <div class="acts">
      <button type="button" class="btn btn-quiet" onclick="dismissDraft()">Dismiss</button>
      <button type="button" class="btn btn-primary" onclick="approveDraft()">Send</button>
    </div>
  </div>
</div>

<div class="overlay" id="feedbackSheet">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
    <div class="grab"></div>
    <h2 id="feedbackTitle">Review</h2>
    <p class="sub">Tell us what’s working in Clinical Care, or what could be better.</p>
    <div class="field">
      <label for="feedbackEmail">Your email (optional)</label>
      <input id="feedbackEmail" type="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="field">
      <label for="feedbackText">Your feedback</label>
      <textarea id="feedbackText" placeholder="Share your thoughts…"></textarea>
    </div>
    <div class="acts">
      <button type="button" class="btn btn-soft" onclick="closeFeedback()">Cancel</button>
      <button type="button" class="btn btn-primary" id="feedbackSendBtn" onclick="sendFeedback()">Send</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

      { from: 'poa', name: 'Mei', initials: 'MC', text: 'Dressing felt tight this morning.', time: '10:05a' },
    ],
    care: [
      { from: 'staff', name: 'Priya', initials: 'PS', text: 'Reassessing dressing on next visit.', time: '10:20a' },
    ],
  },
  elena: {
    caregiver: [
      { from: 'poa', name: 'Sofia', initials: 'SV', text: 'Weight up 2 lbs from yesterday.', time: '8:15a' },
    ],
    care: [
      { from: 'staff', name: 'Marcus', initials: 'MC', text: 'Flagged for RN fluid review.', time: '8:40a', self: true },
    ],
  },
  walter: {
    caregiver: [],
    care: [
      { from: 'staff', name: 'Priya', initials: 'PS', text: 'Incision clean yesterday.', time: '4:05p' },
    ],
  },
};

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(/\s/,'').toLowerCase();
const todayISO = () => new Date().toISOString().slice(0,10);
const pt = id => patients.find(p=>p.id===id);

function loadJSON(k, f){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):f; }catch(e){ return f; } }
function saveJSON(k, v){ localStorage.setItem(k, JSON.stringify(v)); }

function empty(){ return { caregiver:[], care:[] }; }
function getThreads(){
  let s = loadJSON(KEYS.threads, null);
  if(!s){ saveJSON(KEYS.threads, defaultThreads); return structuredClone(defaultThreads); }
  patients.forEach(p=>{
    if(!s[p.id]) s[p.id] = structuredClone(defaultThreads[p.id]||empty());
    else if(Array.isArray(s[p.id])) s[p.id] = { caregiver:s[p.id], care:(defaultThreads[p.id]||{}).care||[] };
    else { s[p.id].caregiver=s[p.id].caregiver||[]; s[p.id].care=s[p.id].care||[]; }
    // Fix bad “You” attribution on other people’s messages
    ['caregiver','care'].forEach(ch=>{
      (s[p.id][ch]||[]).forEach(m=>{
        if(m.self && m.initials && m.initials !== you.initials) m.self = false;
        if(m.from === 'poa') m.self = false;
      });
    });
  });
  return s;
}
function setThreads(t){ saveJSON(KEYS.threads, t); }

let filter = 'need';
let currentId = null;
let channel = 'caregiver';
let drafts = [];
let editId = null;
let _t;

function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(_t); _t=setTimeout(()=>el.classList.remove('show'), 2200);
}

function unread(pid, ch){
  const msgs = (getThreads()[pid]||empty())[ch]||[];
  if(!msgs.length) return 0;
  const last = msgs[msgs.length-1];
  return last.from==='poa' && !last.self ? 1 : 0;
}
function needScore(p){
  return p.need + unread(p.id,'caregiver')*20 + unread(p.id,'care')*10;
}

function setFilter(f){
  filter = f;
  $('fltNeed').classList.toggle('active', f==='need');
  $('fltAll').classList.toggle('active', f==='all');
  renderList();
}

function renderList(){
  let list = patients.slice();
  if(filter==='need') list = list.filter(p=>needScore(p)>=65).sort((a,b)=>needScore(b)-needScore(a));
  else list.sort((a,b)=>a.name.localeCompare(b.name));

  const wrap = $('patientList');
  if(!list.length){ wrap.innerHTML = `<div class="empty">You’re all caught up.</div>`; return; }

  wrap.innerHTML = list.map(p=>{
    const u = unread(p.id,'caregiver') + unread(p.id,'care');
    return `<div class="row">
      <button type="button" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:0" onclick="openThread('${p.id}')">
        <div class="ava" style="background:${p.color}">${esc(p.initials)}</div>
        <div class="row-main">
          <div class="row-name">${esc(p.name)}</div>
          <div class="row-sub">${esc(p.poa.short)} · ${esc(p.assessment.by.split(',')[0])}</div>
        </div>
        ${u?`<span class="need" aria-label="Needs attention"></span>`:''}
      </button>
      <button type="button" class="auto-btn" onclick="openAutoTasks('${p.id}')">Auto Tasks</button>
    </div>`;
  }).join('');
}

function openThread(id){
  currentId = id;
  channel = 'caregiver';
  const p = pt(id);
  $('panel-list').classList.remove('active');
  $('panel-thread').classList.add('active');
  $('thAva').textContent = p.initials;
  $('thAva').style.background = p.color;
  $('thTitle').textContent = p.name;
  $('thSub').textContent = p.poa.short;
  setChannel('caregiver');
}

function closeThread(){
  currentId = null;
  $('panel-thread').classList.remove('active');
  $('panel-list').classList.add('active');
  renderList();
}

function setChannel(ch){
  channel = ch;
  $('segCg').classList.toggle('active', ch==='caregiver');
  $('segCare').classList.toggle('active', ch==='care');
  renderSuggests();
  renderFeed();
}

function renderFeed(){
  const p = pt(currentId); if(!p) return;
  const msgs = (getThreads()[p.id]||empty())[channel]||[];
  $('feed').innerHTML = msgs.map(m=>{
    const mine = isMyMessage(m);
    const isPoa = m.from === 'poa';
    const ava = mine ? you.color : (isPoa ? p.color : staffColor(m));
    const ini = mine ? you.initials : (m.initials || (isPoa ? p.poa.short.slice(0,2).toUpperCase() : '?'));
    const name = mine ? 'You' : (m.name || (isPoa ? p.poa.short : 'Care team'));
    return `<div class="msg ${mine?'me':''}">
      <div class="msg-ava" style="background:${ava}">${esc(ini)}</div>
      <div class="msg-col">
        <div class="msg-name">${esc(name)}</div>
        <div class="bubble">${esc(m.text)}</div>
        <div class="msg-time">${esc(m.time)}</div>
      </div>
    </div>`;
  }).join('') || `<div class="empty">No messages yet</div>`;
  $('feed').scrollTop = $('feed').scrollHeight;
}

function isMyMessage(m){
  if(!m || m.from === 'poa') return false;
  // Only current signed-in clinician counts as “You”
  if(m.initials && m.initials === you.initials) return true;
  if(m.name && m.name === you.name.split(' ')[0] && m.self) return true;
  return false;
}

function staffColor(m){
  const map = { AM:'#34C759', PS:'#AF52DE', MC:'#FF9F0A', JL:'#5AC8FA', MT:'#8E8E93' };
  return map[m.initials] || '#8E8E93';
}

/* Contextual message suggestions */
function renderSuggests(){
  const p = pt(currentId); if(!p) return;
  const poa = p.poa.short;
  const a = p.assessment;
  const clock = p.clock[0];
  let items = [];
  if(channel==='caregiver'){
    items = [
      `Hi ${poa} — update from today’s assessment: ${a.note.split('.')[0]}.`,
      clock ? `Reminder: ${clock.label} is at ${clock.at}. Can you confirm?` : `Can you confirm evening plans for ${p.name.split(' ')[0]}?`,
      `Thanks ${poa} — we’ll keep you posted.`,
      `If anything feels urgent, please call 911.`,
    ];
    const last = [...((getThreads()[p.id]||empty()).caregiver||[])].reverse().find(m=>m.from==='poa');
    if(last) items.unshift(`Thanks for the note — I’m looking into “${last.text.slice(0,40)}${last.text.length>40?'…':''}”.`);
  } else {
    items = [
      `Covering: ${a.note.split('.')[0]}.`,
      clock ? `Please confirm ${clock.label} (${clock.at}).` : `Please post a quick status when you can.`,
      `Who can take the next check-in?`,
      `Flagging for RN review — see latest assessment.`,
    ];
  }
  $('suggests').innerHTML = items.map((t,i)=>
    `<button type="button" class="suggest" data-i="${i}">${esc(t.length>42?t.slice(0,40)+'…':t)}</button>`
  ).join('');
  $('suggests').querySelectorAll('.suggest').forEach(el=>{
    el.onclick = ()=>{ $('input').value = items[+el.dataset.i]; autosize(); $('input').focus(); };
  });
  $('input').placeholder = channel==='caregiver' ? `Message ${poa}…` : 'Message care team…';
}

function autosize(){
  const ta=$('input'); ta.style.height='auto';
  ta.style.height=Math.min(Math.max(ta.scrollHeight,36),110)+'px';
}

function send(){
  const text = $('input').value.trim();
  if(!text||!currentId) return;
  const threads = getThreads();
  const b = threads[currentId]||empty();
  b[channel]=b[channel]||[];
  b[channel].push({ from:'staff', name:you.name.split(' ')[0], initials:you.initials, text, time:now(), self:true });
  threads[currentId]=b; setThreads(threads);
  if(currentId==='ruth' && channel==='caregiver'){
    const replies = loadJSON('familycare-provider-replies', []);
    replies.push({ id:'ana', text, time:now(), at:Date.now() });
    saveJSON('familycare-provider-replies', replies);
  }
  $('input').value=''; autosize(); renderFeed(); toast('Sent');
}

/* Auto Tasks from assessment + clock */
function buildDrafts(p){
  const poa = p.poa.short;
  const out = [];
  // Assessment-based
  const first = p.assessment.note.split(/[.!?]/).map(s=>s.trim()).filter(Boolean)[0];
  out.push({
    id: 'd'+Date.now()+'a',
    source: `Assessment · ${p.assessment.by}`,
    title: `Share with ${poa}: ${first}`,
    due: todayISO(),
    meta: p.assessment.when,
  });
  // Family action from assessment cues
  if(/med/i.test(p.assessment.note)){
    out.push({
      id: 'd'+Date.now()+'m',
      source: `Assessment · ${p.assessment.by}`,
      title: `Confirm today’s medication plan with ${poa}`,
      due: todayISO(),
      meta: p.assessment.when,
    });
  }
  if(/dressing|wound|incision/i.test(p.assessment.note)){
    out.push({
      id: 'd'+Date.now()+'w',
      source: `Assessment · ${p.assessment.by}`,
      title: `Ask ${poa} for a wound / dressing update`,
      due: todayISO(),
      meta: p.assessment.when,
    });
  }
  if(/weight|fluid|fall/i.test(p.assessment.note)){
    out.push({
      id: 'd'+Date.now()+'v',
      source: `Assessment · ${p.assessment.by}`,
      title: `Follow up with ${poa} on today’s vitals / safety`,
      due: todayISO(),
      meta: p.assessment.when,
    });
  }
  // Clock review
  (p.clock||[]).forEach((c,i)=>{
    out.push({
      id: 'd'+Date.now()+'c'+i,
      source: 'Clock review',
      title: `Confirm ${c.label} (${c.at}) with ${poa}`,
      due: todayISO(),
      meta: c.kind,
    });
  });
  // Dedupe by title
  const seen = new Set();
  return out.filter(d=>{ if(seen.has(d.title)) return false; seen.add(d.title); return true; }).slice(0,4);
}

function openAutoTasks(id){
  currentId = id;
  const p = pt(id);
  drafts = buildDrafts(p);
  $('autoTitle').textContent = 'Auto Tasks';
  $('autoSub').textContent = `Recommended from ${p.assessment.by}’s latest note and today’s clock. Nothing sends until you approve.`;
  renderDrafts();
  $('autoSheet').classList.add('show');
}
function closeAuto(){ $('autoSheet').classList.remove('show'); }
function refreshAuto(){ drafts = buildDrafts(pt(currentId)); renderDrafts(); toast('Updated'); }

function renderDrafts(){
  const wrap=$('autoList');
  if(!drafts.length){ wrap.innerHTML=`<div class="empty">No suggestions</div>`; return; }
  wrap.innerHTML = drafts.map(d=>`
    <div class="card">
      <div class="src">${esc(d.source)}</div>
      <div class="t">${esc(d.title)}</div>
      <div class="meta">${esc(d.meta)} · Due today</div>
      <div class="card-acts">
        <button type="button" class="btn btn-soft" onclick="reviewDraft('${d.id}')">Review</button>
        <button type="button" class="btn btn-primary" onclick="quickSend('${d.id}')">Send</button>
      </div>
    </div>`).join('');
}

function reviewDraft(id){
  const d = drafts.find(x=>x.id===id); if(!d) return;
  editId = id;
  $('rvTitle').value = d.title;
  $('rvDate').value = d.due || todayISO();
  $('taskReviewSheet').classList.add('show');
  setTimeout(()=>$('rvTitle').focus(), 100);
}

function dismissDraft(){
  drafts = drafts.filter(x=>x.id!==editId);
  editId = null;
  $('taskReviewSheet').classList.remove('show');
  renderDrafts();
}

function sendTask(title, due){
  const p = pt(currentId); if(!p||!title) return;
  const task = {
    id: 'pt'+Date.now(),
    patientId: p.id, patientName: p.name,
    poaId: p.poa.id, poaName: p.poa.name,
    title, due: due||todayISO(), dateISO: due||todayISO(),
    assigneeId: p.poa.id==='eleanor'?'eleanor':'unassigned',
    who: p.poa.short, fromProvider: true, viaAgent: true,
    providerName: you.name, needs: true, done: false, createdAt: Date.now(),
  };
  const list = loadJSON(KEYS.poaTasks, []);
  list.push(task); saveJSON(KEYS.poaTasks, list);

  const threads = getThreads();
  const b = threads[p.id]||empty();
  b.caregiver = b.caregiver||[];
  b.caregiver.push({
    from:'staff', name:you.name.split(' ')[0], initials:you.initials,
    text:`Task for ${p.poa.short}: ${title}`, time:now(), self:true,
  });
  threads[p.id]=b; setThreads(threads);
  toast(p.linked ? 'Sent to Family Care' : `Sent to ${p.poa.short}`);
}

function approveDraft(){
  const title = $('rvTitle').value.trim();
  if(!title){ toast('Add a task'); return; }
  sendTask(title, $('rvDate').value||todayISO());
  drafts = drafts.filter(x=>x.id!==editId);
  editId = null;
  $('taskReviewSheet').classList.remove('show');
  renderDrafts();
}

function quickSend(id){
  const d = drafts.find(x=>x.id===id); if(!d) return;
  sendTask(d.title, d.due);
  drafts = drafts.filter(x=>x.id!==id);
  renderDrafts();
}

function syncFamily(){
  const outbox = loadJSON('familycare-family-outbox', []);
  if(!outbox.length) return;
  const threads = getThreads();
  let changed = false;
  const left = [];
  outbox.forEach(m=>{
    if(!m.text) return;
    const b = threads.ruth||empty();
    b.caregiver=b.caregiver||[];
    b.caregiver.push({ from:'poa', name:m.name||'Eleanor', initials:m.initials||'EW', text:m.text, time:m.time||now() });
    threads.ruth=b; changed=true;
  });
  if(changed){
    setThreads(threads);
    saveJSON('familycare-family-outbox', left);
    if(currentId==='ruth') renderFeed();
    renderList();
  }
}

$('sendBtn').onclick = send;
$('input').oninput = autosize;
$('input').onkeydown = e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } };
$('autoSheet').onclick = e=>{ if(e.target===$('autoSheet')) closeAuto(); };
$('taskReviewSheet').onclick = e=>{ if(e.target===$('taskReviewSheet')) $('taskReviewSheet').classList.remove('show'); };
$('feedbackSheet').onclick = e=>{ if(e.target===$('feedbackSheet')) closeFeedback(); };

function setTab(which){
  $('tabPatients').classList.toggle('active', which==='patients');
  $('tabReview').classList.toggle('active', which==='review');
  if(which==='patients') $('tabPatients').setAttribute('aria-current','page');
  else $('tabPatients').removeAttribute('aria-current');
  if(which==='review') $('tabReview').setAttribute('aria-current','page');
  else $('tabReview').removeAttribute('aria-current');
}
function goPatients(){
  setTab('patients');
  closeFeedback();
  if(currentId) closeThread();
  else { $('panel-list').classList.add('active'); $('panel-thread').classList.remove('active'); }
}

const FEEDBACK_FORM = 'https://formspree.io/f/mkokkzky';
function openFeedback(){
  setTab('review');
  $('feedbackSheet').classList.add('show');
  setTimeout(()=>$('feedbackText').focus(), 140);
}
function closeFeedback(){
  $('feedbackSheet').classList.remove('show');
  setTab('patients');
}
async function sendFeedback(){
  const message = $('feedbackText').value.trim();
  const email = ($('feedbackEmail')?.value || '').trim();
  if(!message){ toast('Add a note first'); $('feedbackText').focus(); return; }
  const btn = $('feedbackSendBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  try{
    const res = await fetch(FEEDBACK_FORM, {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        email: email || undefined,
        name: you.name,
        role: you.role,
        _subject: 'Clinical Care — review / feedback',
      }),
    });
    if(!res.ok) throw new Error('send failed');
    $('feedbackText').value = '';
    if($('feedbackEmail')) $('feedbackEmail').value = '';
    closeFeedback();
    toast('Thanks — feedback sent');
  } catch(err){
    toast("Couldn't send — try again");
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Send'; }
  }
}

renderList();
syncFamily();
setInterval(syncFamily, 2500);
</script>
